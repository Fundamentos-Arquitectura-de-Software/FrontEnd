# Nginx para FreshSense: sirve la SPA Angular y hace de reverse proxy a la API.
# El frontend llama a /api/... (mismo origen) y Nginx lo reenvía al backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> backend (Container App / contenedor 'backend')
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # La generación de recetas con IA tarda 1-2 min; el default (60s) cortaba la respuesta
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=None; Secure";
    }

    # Swagger / OpenAPI del backend (útil para el informe)
    location /swagger-ui/   { proxy_pass http://backend:8080/swagger-ui/; }
    location /v3/api-docs    { proxy_pass http://backend:8080/v3/api-docs; }

    # SPA: cualquier ruta desconocida cae en index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
